name: Update Formulas

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        formula:
          - name: dijo
            repo: 1995parham/dijo
          - name: gotz
            repo: merschformann/gotz
          - name: toipe
            repo: Samyak2/toipe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get latest release
        id: latest
        uses: actions/github-script@v9
        with:
          script: |
            const [owner, repo] = '${{ matrix.formula.repo }}'.split('/');
            const { data: release } = await github.rest.repos.getLatestRelease({ owner, repo });
            core.setOutput('version', release.tag_name);
            core.setOutput('url', release.html_url);

      - name: Update formula
        id: update
        run: |
          python3 scripts/update-formula.py "${{ matrix.formula.name }}.rb" "${{ steps.latest.outputs.version }}"
          if git diff --quiet -- "${{ matrix.formula.name }}.rb"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Update ${{ matrix.formula.name }} to ${{ steps.latest.outputs.version }}"
          branch: "update/${{ matrix.formula.name }}"
          delete-branch: true
          title: "Update ${{ matrix.formula.name }} to ${{ steps.latest.outputs.version }}"
          body: |
            Automated update of `${{ matrix.formula.name }}` to **${{ steps.latest.outputs.version }}**.

            The `version` line was bumped and every `sha256` recomputed from the
            release artifacts by `scripts/update-formula.py`.

            Release notes: ${{ steps.latest.outputs.url }}
          labels: |
            formula-update
            automated

  # A tap whose formulas are all current produces no commits, and GitHub
  # disables scheduled workflows after 60 days of repository inactivity — so
  # this update check switches itself off precisely when it has been doing its
  # job. Refresh the clock with an empty commit, but only as the deadline nears
  # so routine weeks stay free of noise.
  keepalive:
    runs-on: ubuntu-latest
    needs: update
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Refresh repository activity before the 60-day cutoff
        run: |
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "last commit: ${age} day(s) ago"
          if [ "$age" -lt 50 ]; then
            echo "under the 50-day threshold, nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep the scheduled update check alive"
          git push origin HEAD:main
